# Fragmento para /etc/nginx/nginx.conf (al mismo nivel que el bloque http { }).
# Un solo puerto 443 para todo: nginx mira el nombre (SNI) y reparte
#   turn.TU_DOMINIO    -> coturn (relay de video)
#   remoto.TU_DOMINIO  -> señalización (Node)
# Así el firewall de la empresa solo ve tráfico HTTPS normal.
stream {
    map $ssl_preread_server_name $backend {
        turn.TU_DOMINIO  127.0.0.1:5350;
        default          127.0.0.1:8443;
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_protocol on;          # pasa la IP real del cliente
        proxy_pass $backend;
    }
    # coturn no entiende PROXY protocol: este tramo lo quita
    server {
        listen 127.0.0.1:5350 proxy_protocol;
        proxy_pass 127.0.0.1:5349;
    }
}

