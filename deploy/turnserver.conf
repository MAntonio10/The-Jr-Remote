# /etc/turnserver.conf — relay TURN para cuando la conexión directa no es posible (intranet, 4G con CGNAT)
listening-port=3478
tls-listening-port=5349
external-ip=TU_IP_PUBLICA
realm=turn.TU_DOMINIO

# Credenciales temporales firmadas por el servidor Node (mismo valor que TURN_SECRET)
use-auth-secret
static-auth-secret=CAMBIA_ESTO_POR_UN_SECRETO_LARGO

# Copiados por el deploy-hook de certbot (ver README), legibles por el usuario turnserver
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem

min-port=49160
max-port=49200
fingerprint
# Tope de relays: por sesión (un Senior con 4 The Jr usa varios) y en total
user-quota=12
total-quota=200
no-cli
no-multicast-peers
# Que nadie use el relay para entrar a la red privada del VPS
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
