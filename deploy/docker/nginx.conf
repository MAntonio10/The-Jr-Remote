# Se usa dentro del contenedor; ${DOMINIO} lo rellena docker-compose.yml
worker_processes auto;
events {}
stream {
    map $ssl_preread_server_name $backend {
        turn.${DOMINIO}  127.0.0.1:5350;
        default          127.0.0.1:8443;
    }
    server { listen 443; ssl_preread on; proxy_protocol on; proxy_pass $backend; }
    server { listen 127.0.0.1:5350 proxy_protocol; proxy_pass 127.0.0.1:5349; }
}
http {
    map $http_upgrade $conexion { default upgrade; '' close; }
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        server_name remoto.${DOMINIO};
        ssl_certificate     /etc/letsencrypt/live/remoto.${DOMINIO}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/remoto.${DOMINIO}/privkey.pem;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $conexion;
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_read_timeout 1h;
        }
    }
}
